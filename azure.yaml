# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.32.0'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.17'
        azure.ai.connections: '>=1.0.0-beta.8'
        azure.ai.toolboxes: '>=1.0.0-beta.8'
name: ms-learn-agent
services:
    agent-tools:
        host: azure.ai.toolbox
        uses:
            - ai-project
        description: Microsoft Learn documentation MCP server
        tools:
            - require_approval: never
              server_label: microsoft_learn
              server_url: https://learn.microsoft.com/api/mcp
              type: mcp
    ai-project:
        host: azure.ai.project
        # Model deployment is created manually in the Foundry portal; the agent
        # uses it via AZURE_AI_MODEL_DEPLOYMENT_NAME (set with `azd env set`).
        # Placeholder. Set your own project with:
        #   azd ai project add --project-endpoint <endpoint> --force
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
    ms-learn-agent:
        project: src/ms-learn-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
            - agent-tools
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TOOLBOX_ENDPOINT: ${TOOLBOX_AGENT_TOOLS_MCP_ENDPOINT}
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Answers Microsoft technology questions using the Microsoft Learn MCP server.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: ms-learn-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
